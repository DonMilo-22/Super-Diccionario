name: Word Helper CI

on:
  push:
    branches:
      - main
      - feature/word-helper-chicle-bomba
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q main.py capture.py dialogs.py dictionary.py ocr.py platform_utils.py settings.py stats.py used_words.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
